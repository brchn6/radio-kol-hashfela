name: Build check

# Compile-only check on every push. It does NOT publish an APK: releases are
# signed with the private key on the workstation and uploaded by hand
# (see README "Publishing a new version"), so every public APK carries the
# same signature and installs as an update over the previous one.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build unsigned APK (compile check)
        run: UNSIGNED=1 ./build.sh
